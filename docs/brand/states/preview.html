<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helmet states</title>
<style>
  :root { --bg: #f4f1ea; --text: #0a0a0a; --muted: #5f5e5a; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1f1f1f; --text: #f4f1ea; --muted: #a1a1a1; } }
  :root[data-theme="dark"] { --bg: #1f1f1f; --text: #f4f1ea; --muted: #a1a1a1; }
  body { margin: 0; padding: 32px 16px; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size: 22px; margin: 0 0 20px; }
  h2 { font-size: 16px; margin: 24px 0 12px; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; max-width: 1100px; }
  figure { margin: 0; padding: 16px; border: 3px solid #0a0a0a; box-shadow: 5px 5px 0 #0a0a0a; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .dark figure { background: #161616; color: #f4f1ea; }
  .light figure { background: #f4f1ea; color: #0a0a0a; }
  img { width: 110px; height: 110px; }
  figcaption { font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
