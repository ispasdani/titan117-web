<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Titan helmet states</title>
<!-- Concept only. Helmet modified from "Helmet" by Andrés Cerdas, from the Noun Project (noun_Helmet_22025). -->
<style>
  :root {
    --bg: #f4f1ea; --ink: #0a0a0a; --tile: #161616; --text: #0a0a0a; --muted: #5f5e5a;
    --neon: #c4f012; --amber: #EF9F27; --red: #E24B4A; --off: #5F5E5A;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0a0a0a; --text: #f4f1ea; --muted: #a1a1a1; }
  }
  :root[data-theme="dark"] { --bg: #0a0a0a; --text: #f4f1ea; --muted: #a1a1a1; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 32px 16px; }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
  p.lede { margin: 0 0 24px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; max-width: 1100px; }
  .card { background: var(--tile); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); padding: 20px 16px 14px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .card span { color: #f4f1ea; font-weight: 600; font-size: 14px; }
  .card small { color: #a1a1a1; font-size: 12px; text-align: center; }
  svg.helmet { width: 150px; height: 150px; overflow: visible; margin: 14px 0; }
  .body { fill: #f4f1ea; stroke: #f4f1ea; stroke-width: .6; stroke-linejoin: round; }
  .visor { fill: var(--ink); stroke: #f4f1ea; stroke-width: 1.2; }
  .eye, .dot { transform-box: fill-box; transform-origin: center; }

  /* Idle: a slow blink now and then */
  .idle .eye { fill: var(--neon); animation: blink 5s infinite; }
  .idle .dot { fill: var(--neon); }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }

  /* Working: eyes breathe, a scan line sweeps the visor */
  .working .eye, .working .dot { fill: var(--neon); animation: breathe 1.4s ease-in-out infinite; }
  .working .scan { fill: var(--neon); opacity: .55; animation: scan 1.6s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes scan { 0% { transform: translateX(-34px); } 50% { transform: translateX(34px); } 100% { transform: translateX(-34px); } }

  /* Needs approval: amber, slow pulse */
  .approval .eye, .approval .dot { fill: var(--amber); animation: breathe 2s ease-in-out infinite; }

  /* Error: red, a short flicker */
  .error .eye, .error .dot { fill: var(--red); animation: flicker 2.4s steps(1) infinite; }
  @keyframes flicker { 0%, 100% { opacity: 1; } 8% { opacity: .2; } 12% { opacity: 1; } 16% { opacity: .3; } 20% { opacity: 1; } }

  /* Offline: grey and still */
  .offline .eye, .offline .dot { fill: var(--off); }

  /* Loading: an energy shield of hexagon segments turns around the helmet */
  .loading .eye, .loading .dot { fill: var(--neon); animation: breathe 1s ease-in-out infinite; }
  .shield { transform-box: view-box; transform-origin: 50px 50px; }
  .shield .ring { fill: none; stroke: var(--neon); stroke-width: 1.6; stroke-dasharray: 9 5; }
  .shield.a { animation: spin 3s linear infinite; }
  .shield.b { animation: spin 5s linear infinite reverse; }
  .shield.b .ring { stroke-dasharray: 3 9; opacity: .6; }
  .shield.pulse { animation: shieldpulse 1.6s ease-out infinite; }
  .shield.pulse .ring { stroke-dasharray: none; stroke-width: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes shieldpulse { 0% { transform: scale(.85); opacity: .8; } 100% { transform: scale(1.1); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
</head>
<body>
<h1>Titan's helmet: states and motion</h1>
<p class="lede">Concept for the app icon, tray icon and Titan's avatar. Motion stops for people who turn on reduced motion.</p>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <path id="visor" d="M56.6,60.859c0,0-11.407,0.041-13.365,0.041S40.57,65.8,40.57,65.8c-21.76-2.176-18.133-28.106-18.133-28.106s25.204-13.772,53.854-1.537c0.682,0.291,4.88,28.381-16.933,29.643C59.358,65.8,58.553,60.801,56.6,60.859z"/>
    <clipPath id="visorClip"><use href="#visor"/></clipPath>
    <polygon id="hex" points="50,-4 97,23 97,77 50,104 3,77 3,23"/>
    <g id="body">
      <path d="M44.494,62.453c-1.608,0-2.187,4.021-2.187,4.021l3.241,1.531v3.885h8.956v-3.885l3.225-1.531c0,0-0.66-4.104-2.264-4.056"/>
      <path d="M43.892,18.96L40.3,17.164h-0.091h-8.98l-0.049,0.028l-4.283,4.283L26.846,21.5l-6.632,3.868l-0.006,0.035l-0.599,5.776l0.045-0.088c-2.639,3.563-3.116,20.229-3.131,20.473h-0.19h5.088c-2.556-7.736-0.76-14.713-0.76-14.713s26.274-15.005,57.789-1.547c0,0,2.17,8.178-0.316,16.26h5.803c0,0-1.105-17.737-3.132-20.473l-0.599-5.776l-6.632-3.868l-4.282-4.283h-8.98L56.72,18.96H43.892z"/>
      <path d="M23.437,21.645c0,0,2.201-6.817,3.596-7.568s13.313-5.153,13.313-5.153h19.968c0,0,11.917,4.509,13.152,5.153c1.234,0.644,3.594,7.568,3.594,7.568l-3.594-2.147l-4.134-4.134l-9.019-0.08l-3.704,2.173H43.888l-3.542-2.094l-9.179-0.08l-4.133,4.213L23.437,21.645z"/>
      <polygon points="43.722,73.559 56.41,73.559 56.41,68.9 59.279,67.535 68.593,79.646 56.41,91.076 54.482,88.867 46.051,88.867 43.722,91.076 31.371,79.646 40.533,67.535 43.722,68.9"/>
      <path fill-rule="evenodd" d="M81.585,53.076H78.05c-3.967,13.342-15.954,14.536-15.954,14.536l9.227,11.627l-7.243,6.634l9.055-6.634l11.988-12.942V54.668L81.585,53.076z M78.298,72.553l-4.689,5.072h-2.678v-4.83l7.367-6.1V72.553z"/>
      <path fill-rule="evenodd" d="M37.905,67.612c0,0-11.987-1.194-15.954-14.536h-3.536l-3.536,1.592v11.629l11.987,12.942l9.055,6.634l-7.244-6.634L37.905,67.612z M26.359,77.625l-4.69-5.072v-5.857l7.368,6.1v4.83H26.359z"/>
    </g>
  </defs>
</svg>

<div class="grid" id="grid"></div>

<script>
  const states = [
    ['idle', 'Idle', 'A slow blink every few seconds'],
    ['working', 'Working', 'Eyes breathe, a scan line sweeps the visor'],
    ['loading', 'Loading', 'An energy shield turns around the helmet'],
    ['approval', 'Needs approval', 'Amber, a slow pulse'],
    ['error', 'Error', 'Red, a short flicker'],
    ['offline', 'Offline', 'Grey and still']
  ];
  const helmet = (state) => `
    <svg class="helmet ${state}" viewBox="10 5 80 90" role="img" aria-label="Titan helmet, ${state}">
      ${state === 'loading' ? `
        <g class="shield pulse"><use href="#hex" class="ring"/></g>
        <g class="shield a"><use href="#hex" class="ring"/></g>
        <g class="shield b"><use href="#hex" class="ring" transform="translate(50 50) scale(1.07) translate(-50 -50)"/></g>` : ''}
      <use href="#body" class="body"/>
      <use href="#visor" class="visor"/>
      ${state === 'working' ? `<g clip-path="url(#visorClip)"><rect class="scan" x="48" y="34" width="4" height="34"/></g>` : ''}
      <polygon class="eye" points="29,44 45,46 44,50.5 30,49.5"/>
      <polygon class="eye" points="71,44 55,46 56,50.5 70,49.5"/>
      <circle class="dot" cx="81.271" cy="63.489" r="2.2"/><circle class="dot" cx="81.271" cy="57.185" r="2.2"/>
      <circle class="dot" cx="18.538" cy="63.489" r="2.2"/><circle class="dot" cx="18.538" cy="57.185" r="2.2"/>
    </svg>`;
  document.getElementById('grid').innerHTML = states.map(([s, label, note]) =>
    `<div class="card">${helmet(s)}<span>${label}</span><small>${note}</small></div>`).join('');
</script>
</body>
</html>
